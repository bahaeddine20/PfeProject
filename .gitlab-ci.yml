stages:
  - build
  - deploy
  - start_emulator
  - start_emulator_mobile
  - run
  - run2
  - test
  - push

variables:
  IMAGE_NAME: aestoolscelad/flask-app-baha:v4.0


build:
  stage: build
  tags:
    - python-shell

  retry: 2
  script:
    - docker compose down

    - docker compose build
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[build\]/'
      when: on_success
    - when: never

deploy:
  stage: deploy
  tags:
    - python-shell

  retry: 2
  script:
    - docker compose down
    - docker compose up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[deploy\]/'
      when: on_success
    - when: never

start_emulator:
  stage: start_emulator
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
    AVD_NAME: "Automotive_1408p_landscape_with_Google_Play_API_34-ext9_2"
    # ANDROID_SDK_ROOT should be set in GitLab's CI/CD settings or the runner's config
  script:
    - |
      # Use PowerShell for the script logic
      Write-Host "--- Starting Android Emulator Setup ---"
      
      # --- Corrected Configuration ---
      # Construct paths at runtime using PowerShell's Join-Path for robustness
      $avdName = $env:AVD_NAME
      $emulatorPath = Join-Path $env:ANDROID_SDK_ROOT "emulator\emulator.exe"
      $adbPath = Join-Path $env:ANDROID_SDK_ROOT "platform-tools\adb.exe"
      $bootTimeoutSeconds = 360 # 6-minute timeout
      
      # Verify that the paths are correct before proceeding
      Write-Host "ADB Path: $adbPath"
      Write-Host "Emulator Path: $emulatorPath"
      if (-not (Test-Path $adbPath)) {
        Write-Host "❌ ERROR: adb.exe not found at the specified path. Check ANDROID_SDK_ROOT."
        exit 1
      }
      if (-not (Test-Path $emulatorPath)) {
        Write-Host "❌ ERROR: emulator.exe not found at the specified path. Check ANDROID_SDK_ROOT."
        exit 1
      }

      # Check if the emulator is already running to avoid conflicts
      $existingEmulator = & $adbPath devices | Select-String "emulator-5554"
      if ($existingEmulator) {
        Write-Host "✅ Emulator 'emulator-5554' is already running. Proceeding..."
      } else {
        # (The rest of your script remains the same)
        Write-Host "🚀 No running emulator detected. Launching AVD: $avdName"
      
        $emulatorArgs = @{
            FilePath = $emulatorPath
            ArgumentList = @(
                "-avd", $avdName,
                "-no-window",
                "-no-snapshot",
                "-no-boot-anim",
                "-netdelay", "none",
                "-netspeed", "full"
            )
            PassThru = $true 
        }
      
        try {
            $emulatorProcess = Start-Process @emulatorArgs -ErrorAction Stop
            Write-Host "✅ Emulator process started with PID: $($emulatorProcess.Id)"
        } catch {
            Write-Host "❌ ERROR: Failed to start the emulator process."
            Write-Host $_.Exception.Message
            exit 1
        }
      
        # --- Robust Wait Loop ---
        Write-Host "⏳ Waiting for emulator to fully boot (Timeout: $bootTimeoutSeconds seconds)..."
        $startTime = Get-Date
        $booted = $false
      
        while (((Get-Date) - $startTime).TotalSeconds -lt $bootTimeoutSeconds) {
            $bootCompleted = & $adbPath -s emulator-5554 shell getprop sys.boot_completed 2>$null
            if ($bootCompleted -and $bootCompleted.Trim() -eq '1') {
                Write-Host "✅ Emulator is fully booted!"
                $booted = $true
                break
            }
      
            if ($emulatorProcess.HasExited) {
                Write-Host "❌ ERROR: Emulator process exited prematurely."
                exit 1
            }
      
            Start-Sleep -Seconds 5
            Write-Host "." -NoNewline
        }
      
        if (-not $booted) {
            Write-Host ""
            Write-Host "❌ ERROR: Timeout reached while waiting for the emulator to boot."
            Stop-Process -Id $emulatorProcess.Id -Force -ErrorAction SilentlyContinue
            exit 1
        }
      }
      
      Write-Host "✅ Waiting for system services to stabilize..."
      Start-Sleep -Seconds 10
      
      Write-Host "--- Emulator Ready for Tests ---"
      & $adbPath devices
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator\]/'
      when: on_success
    - when: never

start_emulator_mobile:
  stage: start_emulator_mobile
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    # Vérifier si un émulateur est déjà ouvert
    - $devices = adb devices | Select-String "emulator-5556" | ForEach-Object { $_.ToString() }
    - if (-not $devices) {
        Write-Host "✅ Aucun émulateur mobile détecté, lancement en cours...";
        Start-Process -FilePath "emulator" -ArgumentList "-avd Medium_Phone_API_35" -NoNewWindow;
        Write-Host "⏳ Attente du lancement de l'émulateur mobile...";
        do {
          Start-Sleep -Seconds 5
          $devices = adb devices | Select-String "emulator-5556"
        } while (-not $devices)
      } else {
        Write-Host "✅ Un émulateur mobile est déjà en cours d'exécution."
      }

    # Attendre qu’il soit complètement prêt
    - adb -s emulator-5556 wait-for-device
    - while ((adb -s emulator-5556 shell getprop sys.boot_completed).Trim() -ne "1") { Start-Sleep -Seconds 5 }

  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator_mobile\]/'
      when: on_success
    - when: never

run_flask_extern:
  stage: run
  tags:
    - python-shell


  before_script:
    - cd ServeurFlaskHost
    - python -m venv venv
    - venv\Scripts\Activate.ps1
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - Start-Process -NoNewWindow -FilePath "python" -ArgumentList "flaskhost.py"
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[run\]/'
      when: on_success

    - when: never

run_tests:
  stage: test
  tags:
    - python-shell


  before_script:
    - python -m venv venv
    - venv\Scripts\Activate.ps1
    - python -m pip install --upgrade pip
    - pip install robotframework
    - pip install requests
  script:
    - python execution.py
  retry: 2
  artifacts:
    paths:
      - results/Tests_*.zip
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[test\]/'
      when: on_success
    - when: never

run_flask_and_test:
  stage: run2
  tags:
    - python-shell
  variables:
    SHELL: "powershell"  # Force l'utilisation de PowerShell Core


  before_script:
    - cd ServeurFlaskHost
    - python -m venv venv
    - ./venv/Scripts/Activate.ps1  # Format correct pour pwsh
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install robotframework requests

  script:
    # Démarrer Flask en arrière-plan
    - $flaskProcess = Start-Process -FilePath "python" -ArgumentList "flaskhost.py" -PassThru -NoNewWindow -RedirectStandardOutput "flask.log" -RedirectStandardError "flask_error.log"
    - $flaskProcess.Id | Out-File flask_pid.txt
    - Start-Sleep -Seconds 5

    # Exécuter les tests (reste dans le même répertoire)
    - docker exec pfeproject-flask-1 python execution.py --list    FonctionnaliteBluetooth.robot


    # Arrêter Flask proprement
    - Stop-Process -Id $flaskProcess.Id -Force -ErrorAction SilentlyContinue

  retry: 2


  artifacts:
    paths:
      - ServeurFlaskHost/resultats
      - ServeurFlaskHost/flask.log
      - ServeurFlaskHost/flask_error.log  # Pour le débogage
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[run2\]/'
      when: on_success
    - when: never





push:
  stage: push
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

  before_script:
    - apk add --no-cache docker-cli
    - docker info

  script:
    - docker system prune -f
    - docker compose build
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker compose push
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[push\]/'
      when: on_success
    - when: never


