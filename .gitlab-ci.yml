stages:
  - build
  - deploy
  - start_emulator
  - start_emulator_mobile
  - run
  - run2
  - test
  - push

variables:
  IMAGE_NAME: aestoolscelad/flask-app-baha:v4.0


build:
  stage: build
  tags:
    - python-shell

  retry: 2
  script:
    - docker compose down

    - docker compose build
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[build\]/'
      when: on_success
    - when: never

deploy:
  stage: deploy
  tags:
    - python-shell

  retry: 2
  script:
    - docker compose down
    - docker compose up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[deploy\]/'
      when: on_success
    - when: never
start_emulator:
  stage: start_emulator
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    - $emulator_port = "emulator-5554"
    # Vérifier si l'émulateur est déjà fonctionnel
    - $device_state = adb devices | Where-Object { $_ -match "$emulator_port\s+device" }
    - if (-not $device_state) {
        # Tuer les processus bloqués
        - Get-Process "emulator*" -ErrorAction SilentlyContinue | Stop-Process -Force
        - adb kill-server
        - Start-Sleep -Seconds 2
        
        Write-Host "✅ Lancement de l'émulateur Automotive..."
        - $process = Start-Process -FilePath "emulator" `
            -ArgumentList "-avd Automotive_1408p_landscape_with_Google_Play_API_34-ext9_2" `
            -WindowStyle Minimized `
            -PassThru
        
        # Vérifier que le processus a démarré
        - if (-not $process.Id) {
            Write-Host "❌ Échec du démarrage de l'émulateur"
            exit 1
          }
      } else {
        Write-Host "✅ Émulateur Automotive déjà en cours d'exécution"
      }
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator\]/'
      when: on_success
    - when: never

wait_emulator_ready:
  stage: start_emulator
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    - $emulator_port = "emulator-5554"
    - $timeout = 300  # 5 minutes timeout
    - $counter = 0
    - |
        Write-Host "⏳ Attente de l'émulateur Automotive..."
        while ($counter -lt $timeout) {
            # Vérifier la connexion ADB
            $device = adb devices | Select-String "$emulator_port"
            if (-not $device) {
                Write-Host "⚠️ Émulateur non détecté, attente..."
                Start-Sleep -Seconds 5
                $counter += 5
                continue
            }
            
            # Vérifier le statut boot_completed
            $boot_status = adb -s $emulator_port shell "getprop sys.boot_completed" 2>$null
            if (($boot_status -eq "1") -and ($device -match "device")) {
                Write-Host "✅ Émulateur Automotive prêt"
                exit 0
            }
            
            Start-Sleep -Seconds 5
            $counter += 5
            Write-Host "⌛ Statut: $boot_status | Compteur: $counter/$timeout"
        }
        
        # Gestion du timeout
        Write-Host "❌ Timeout: L'émulateur Automotive n'a pas démarré"
        adb devices
        Get-Process "emulator*" | Stop-Process -Force
        exit 1
  needs:
    - start_emulator
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator\]/'
      when: on_success
    - when: never

