stages:
  - build
  - deploy
  - start_emulator
  - start_emulator_mobile
  - run
  - run2
  - test
  - push

variables:
  IMAGE_NAME: aestoolscelad/flask-app-baha:v4.0


build:
  stage: build
  tags:
    - python-shell

  retry: 2
  script:
    - docker compose down

    - docker compose build
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[build\]/'
      when: on_success
    - when: never



deploy:
  stage: deploy
  tags:
    - python-shell

  before_script:
    - Start-Sleep -Seconds 5
    - Remove-Item -Path "ServeurFlaskHost\*.log" -Force -ErrorAction SilentlyContinue
  retry: 2
  script:
    - docker compose down
    - docker compose up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[deploy\]/'
      when: on_success
    - when: never

start_emulator:
  stage: start_emulator
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    - $devices = adb devices | Select-String "emulator-5554"
    - if (-not $devices) {
        Write-Host "✅ Aucun émulateur détecté, lancement en cours...";
        Start-Process -FilePath "emulator" -ArgumentList "-avd Automotive_1408p_landscape_with_Google_Play_API_34-ext9_2" -WindowStyle Minimized;
        Write-Host "✅ Emulateur lancé"
      } else {
        Write-Host "✅ Un émulateur est déjà en cours d'exécution."
      }
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator\]/'
      when: on_success
    - when: never

wait_emulator_ready:
  stage: start_emulator
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    - Write-Host "⏳ Attente de l'émulateur..."
    - adb -s emulator-5554 wait-for-device
    - while ((adb -s emulator-5554 shell getprop sys.boot_completed).Trim() -ne "1") {
        Start-Sleep -Seconds 5
      }
    - Write-Host "✅ Emulateur prêt"
  needs:
    - start_emulator
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator\]/'
      when: on_success
    - when: never


start_emulator_mobile:
  stage: start_emulator_mobile
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    - $devices = adb devices | Select-String "emulator-5556"
    - if (-not $devices) {
        Write-Host "✅ Aucun émulateur détecté, lancement en cours...";
        Start-Process -FilePath "emulator" -ArgumentList "-avd Medium_Phone_API_35" -WindowStyle Minimized;
        Write-Host "✅ Emulateur lancé"
      } else {
        Write-Host "✅ Un émulateur est déjà en cours d'exécution."
      }
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator_mobile\]/'
      when: on_success
    - when: never


wait_emulator_ready_mobile:
  stage: start_emulator_mobile
  tags:
    - python-shell
  variables:
    SHELL: "powershell"
  script:
    - Write-Host "⏳ Attente de l'émulateur..."
    - adb -s emulator-5556 wait-for-device
    - while ((adb -s emulator-5556 shell getprop sys.boot_completed).Trim() -ne "1") {
        Start-Sleep -Seconds 5
      }
    - Write-Host "✅ Emulateur prêt"
  needs:
    - start_emulator_mobile
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[emulator_mobile\]/'
      when: on_success
    - when: never



run_flask_extern:
  stage: run
  tags:
    - python-shell


  before_script:
    - cd ServeurFlaskHost
    - python -m venv venv
    - venv\Scripts\Activate.ps1
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - Start-Process -NoNewWindow -FilePath "python" -ArgumentList "flaskhost.py"
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[run\]/'
      when: on_success

    - when: never

run_tests:
  stage: test
  tags:
    - python-shell


  before_script:
    - python -m venv venv
    - venv\Scripts\Activate.ps1
    - python -m pip install --upgrade pip
    - pip install robotframework
    - pip install requests
  script:

    - python execution.py



  retry: 2
  artifacts:
    paths:
      - results/Tests_*.zip
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[test\]/'
      when: on_success
    - when: never
run_flask_and_test:
  stage: run2
  tags:
    - python-shell
  variables:
    SHELL: "powershell"

  before_script:
    - cd ServeurFlaskHost
    - python -m venv venv
    - ./venv/Scripts/Activate.ps1

  script:
    # Start emulators and Flask
    - $emulateurautoProcess = Start-Process -FilePath "python" -ArgumentList "startemulateur.py automotive" -PassThru -NoNewWindow
    - $emulateurProcess = Start-Process -FilePath "python" -ArgumentList "startemulateur.py mobile" -PassThru -NoNewWindow
    - pip install -r requirements.txt
    - pip install robotframework requests
    - python -m pip install --upgrade pip
    - $flaskProcess = Start-Process -FilePath "python" -ArgumentList "flaskhost.py" -PassThru -NoNewWindow -RedirectStandardOutput "flask.log" -RedirectStandardError "flask_error.log"
    - $flaskProcess.Id | Out-File flask_pid.txt
    - Start-Sleep -Seconds 60  # Wait for Flask to start

    # Execute tests
    - docker exec pfeproject-flask-1 python execution.py --list   FonctionnaliteBluetooth.robot    InstallationApplications.robot    FonctionnaliteMaps.robot


      # Arrêter les processus
    - Stop-Process -Id $flaskProcess.Id -Force -ErrorAction SilentlyContinue


    # Proper emulator shutdown with error handling
    - |
      adb devices | ForEach-Object {
        if ($_ -match "(emulator-\d+)") {
          $emu = $matches[1]
          Write-Host "🔴 Closing $emu"
          adb -s $emu emu kill
          Start-Sleep -Seconds 3
          
          # Verify if emulator is still running
          if (adb devices | Select-String -Pattern $emu) {
            Write-Host "⚠️ Force closing $emu"
            # Find and kill associated QEMU processes
            $port = $emu.Split("-")[1]
            Get-Process -Name "qemu-system-x86_64" -ErrorAction SilentlyContinue | 
              Where-Object { $_.CommandLine -match "port $port" } | 
              Stop-Process -Force
          }
        }
      }


  artifacts:
    paths:
      - ServeurFlaskHost/resultats
      - ServeurFlaskHost/*.log  # Récupère tous les fichiers .log
      - ServeurFlaskHost/flask_pid.txt
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[run2\]/'
      when: on_success
    - when: never




push:
  stage: push
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

  before_script:
    - apk add --no-cache docker-cli
    - docker info

  script:
    - docker system prune -f
    - docker compose build
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker compose push
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[push\]/'
      when: on_success
    - when: never


